name: Publish weather source and notify IndexNow


on:
  push:
    branches: [main]
  workflow_dispatch:


permissions:
  contents: read


concurrency:
  group: weather-pages
  cancel-in-progress: false


jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/configure-pages@v5
      - name: Prepare weather-only static site
        env:
          INDEXNOW_KEY: ${{ secrets.WEATHERSITE_INDEXNOW_KEY }}
        run: |
          python3 - <<'PY'
          import os, pathlib, re, shutil
          key = os.environ["INDEXNOW_KEY"]
          if not re.fullmatch(r"[a-f0-9]{32}", key):
              raise ValueError("Missing or invalid protected IndexNow key")
          destination = pathlib.Path("_site")
          destination.mkdir()
          for name in ("index.html", "feed.json", "weather-visuals.mjs"):
              shutil.copyfile(name, destination / name)
